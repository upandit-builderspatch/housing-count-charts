<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Slope County, North Dakota</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: Inter, system-ui, -apple-system, "Segoe UI", sans-serif; background: transparent; color: #1F2D3D; }
        .container { padding: 20px; }
        .legend { display: flex; gap: 24px; margin-top: 16px; font-size: 14px; flex-wrap: wrap; align-items: center; }
        .legend-group { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
        .legend-group-label { font-size: 13px; font-weight: 600; color: #1F2D3D; margin-right: 4px; }
        .legend-item { display: flex; align-items: center; gap: 8px; font-size: 14px; }
        .legend-swatch { width: 14px; height: 14px; flex-shrink: 0; }
        .legend-outline { border: 2px solid #A9D4DA; background: #EEF6F7; }
        .swatch-eli { background: #8E1268; }
        .swatch-50ami { background: #F785D8; }
        .swatch-80ami { background: #F9C4E8; border: 1px solid #EFA8D6; }
        .swatch-shortage { background: repeating-linear-gradient(45deg, #C9D6D9, #C9D6D9 2px, #EEF6F7 2px, #EEF6F7 6px); }
        .swatch-surplus { background: #8FC9CF; }
        svg { display: block; width: 100%; height: auto; }
        .tooltip { position: absolute; background: #1F2D3D; color: white; padding: 8px 12px; border-radius: 4px; font-size: 12px; pointer-events: none; opacity: 0; transition: opacity 0.2s; z-index: 1000; }
    </style>
</head>
<body>
    <div class="container">
        <svg id="chart"></svg>
        <div class="legend">
            <div class="legend-group">
                <span class="legend-group-label">Affordable and available homes:</span>
                <div class="legend-item"><div class="legend-swatch swatch-eli"></div><span>Available to ELI renters (≤30% AMI)</span></div>
                <div class="legend-item"><div class="legend-swatch swatch-50ami"></div><span>Additional, up to 50% AMI</span></div>
                <div class="legend-item"><div class="legend-swatch swatch-80ami"></div><span>Additional, up to 80% AMI</span></div>
            </div>
            <div class="legend-group">
                <div class="legend-item"><div class="legend-swatch legend-outline"></div><span>Renter households</span></div>
                
                <div class="legend-item"><div class="legend-swatch swatch-surplus"></div><span>Surplus</span></div>
            </div>
        </div>
        <div class="tooltip" id="tooltip"></div>
    </div>

    <script>
        const chartData = {"eli": {"supply": 4, "demand": 4, "per_100": 100, "shortage": 0, "surplus": 0, "grade": "Balanced", "badge_color": "#FDE8F6"}, "fifty": {"supply": 14, "demand": 14, "per_100": 100, "shortage": 0, "surplus": 0, "grade": "Balanced", "badge_color": "#FDE8F6"}, "eighty": {"supply": 33, "demand": 29, "per_100": 114, "shortage": 0, "surplus": 4, "grade": "Surplus", "badge_color": "#D6EAEE"}, "global_max": 37.949999999999996};

        const ROW_HEIGHT = 56;
        const ROW_GAP = 20;
        const MARGIN_LEFT = 200;
        const MARGIN_RIGHT = 50;
        const MARGIN_TOP = 20;
        const SEGMENT_INSET = 6;
        const SEGMENT_GAP = 1;

        function formatNumber(n) {
            if (!n || n === 0) return '0';
            n = parseInt(n);
            if (n < 10000) return n.toLocaleString();
            if (n < 1000000) {
                const k = n / 1000;
                return (k < 100 ? k.toFixed(1) : k.toFixed(0)).replace(/\.0$/, '') + 'K';
            }
            return (n / 1000000).toFixed(1).replace(/\.0$/, '') + 'M';
        }

        function render() {
            const svg = document.getElementById('chart');
            const container = svg.parentElement;
            const containerWidth = container.clientWidth;

            // Use actual container width for pixel-based sizing
            const chartWidth = containerWidth - MARGIN_LEFT - MARGIN_RIGHT;
            const chartHeight = MARGIN_TOP + (ROW_HEIGHT + ROW_GAP) * 3;

            svg.innerHTML = '';
            svg.setAttribute('width', containerWidth);
            svg.setAttribute('height', chartHeight);
            svg.style.maxWidth = '100%';

            const tiers = [
                { key: 'eli', label: 'Extremely low-income', sublabel: '(≤30% AMI)' },
                { key: 'fifty', label: 'Up to 50% AMI', sublabel: '' },
                { key: 'eighty', label: 'Up to 80% AMI', sublabel: '' }
            ];

            const tooltip = document.getElementById('tooltip');

            tiers.forEach((tier, idx) => {
                const data = chartData[tier.key];
                const y = MARGIN_TOP + idx * (ROW_HEIGHT + ROW_GAP);

                // Calculate positions
                const boxX = MARGIN_LEFT;
                const boxWidth = chartWidth * (data.demand / chartData.global_max);
                const boxRightEdge = boxX + boxWidth;
                const segY = y + SEGMENT_INSET;
                const segHeight = ROW_HEIGHT - 2 * SEGMENT_INSET;

                const eli_supply = parseFloat(chartData.eli.supply);
                const fifty_supply = parseFloat(chartData.fifty.supply);
                const eighty_supply = parseFloat(chartData.eighty.supply);

                let seg1_width = 0, seg2_width = 0, seg3_width = 0;
                if (tier.key === 'eli') {
                    seg1_width = chartWidth * (data.supply / chartData.global_max);
                } else if (tier.key === 'fifty') {
                    seg1_width = chartWidth * (eli_supply / chartData.global_max);
                    seg2_width = chartWidth * ((data.supply - eli_supply) / chartData.global_max);
                } else if (tier.key === 'eighty') {
                    seg1_width = chartWidth * (eli_supply / chartData.global_max);
                    seg2_width = chartWidth * ((fifty_supply - eli_supply) / chartData.global_max);
                    seg3_width = chartWidth * ((data.supply - fifty_supply) / chartData.global_max);
                }

                // Clip segment widths at household box edge
                const totalSegWidth = seg1_width + seg2_width + seg3_width;
                const clippedScale = totalSegWidth > boxWidth ? boxWidth / totalSegWidth : 1;
                if (clippedScale < 1) {
                    seg1_width *= clippedScale;
                    seg2_width *= clippedScale;
                    seg3_width *= clippedScale;
                }

                // Outline box
                const rect = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
                rect.setAttribute('x', boxX);
                rect.setAttribute('y', y);
                rect.setAttribute('width', boxWidth);
                rect.setAttribute('height', ROW_HEIGHT);
                rect.setAttribute('fill', '#EEF6F7');
                rect.setAttribute('stroke', '#A9D4DA');
                rect.setAttribute('stroke-width', '2');
                svg.appendChild(rect);

                // Shortage hatching
                if (data.shortage > 0) {
                    let fillEndX = boxX + chartWidth * (data.supply / chartData.global_max);
                    const shortageWidth = Math.min(
                        chartWidth * (data.shortage / chartData.global_max),
                        boxRightEdge - fillEndX
                    );
                    if (shortageWidth > 0) {
                        const hatching = document.createElementNS('http://www.w3.org/2000/svg', 'defs');
                        const pattern = document.createElementNS('http://www.w3.org/2000/svg', 'pattern');
                        pattern.setAttribute('id', `h-${tier.key}`);
                        pattern.setAttribute('patternUnits', 'userSpaceOnUse');
                        pattern.setAttribute('width', '6');
                        pattern.setAttribute('height', '6');
                        const line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
                        line.setAttribute('x1', '0');
                        line.setAttribute('y1', '0');
                        line.setAttribute('x2', '6');
                        line.setAttribute('y2', '6');
                        line.setAttribute('stroke', '#C9D6D9');
                        line.setAttribute('stroke-width', '1');
                        pattern.appendChild(line);
                        svg.appendChild(hatching);
                        hatching.appendChild(pattern);

                        const hatchRect = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
                        hatchRect.setAttribute('x', fillEndX);
                        hatchRect.setAttribute('y', segY);
                        hatchRect.setAttribute('width', shortageWidth);
                        hatchRect.setAttribute('height', segHeight);
                        hatchRect.setAttribute('fill', `url(#h-${tier.key})`);
                        svg.appendChild(hatchRect);
                    }
                }

                // Segments
                let segX = boxX + 6;
                const colors = ['#8E1268', '#F785D8', '#F9C4E8'];
                const widths = [seg1_width - 2, seg2_width - SEGMENT_GAP - 2, seg3_width - SEGMENT_GAP - 2];

                if (seg1_width > 0) {
                    const seg = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
                    seg.setAttribute('x', segX);
                    seg.setAttribute('y', segY);
                    seg.setAttribute('width', widths[0]);
                    seg.setAttribute('height', segHeight);
                    seg.setAttribute('fill', colors[0]);
                    svg.appendChild(seg);
                    segX += seg1_width;
                }

                if (seg2_width > 0) {
                    segX += SEGMENT_GAP;
                    const seg = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
                    seg.setAttribute('x', segX);
                    seg.setAttribute('y', segY);
                    seg.setAttribute('width', widths[1]);
                    seg.setAttribute('height', segHeight);
                    seg.setAttribute('fill', colors[1]);
                    svg.appendChild(seg);
                    segX += seg2_width;
                }

                if (seg3_width > 0) {
                    segX += SEGMENT_GAP;
                    const seg = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
                    seg.setAttribute('x', segX);
                    seg.setAttribute('y', segY);
                    seg.setAttribute('width', widths[2]);
                    seg.setAttribute('height', segHeight);
                    seg.setAttribute('fill', colors[2]);
                    seg.setAttribute('stroke', '#EFA8D6');
                    seg.setAttribute('stroke-width', '1');
                    svg.appendChild(seg);
                }

                // Surplus (with 1px white gap from household box edge)
                if (data.surplus > 0) {
                    const surplusGap = 1;
                    const surplusStartX = boxRightEdge + surplusGap;
                    const surplusWidth = chartWidth * (data.surplus / chartData.global_max);
                    const surplus = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
                    surplus.setAttribute('x', surplusStartX);
                    surplus.setAttribute('y', segY);
                    surplus.setAttribute('width', surplusWidth);
                    surplus.setAttribute('height', segHeight);
                    surplus.setAttribute('fill', '#8FC9CF');
                    svg.appendChild(surplus);
                }

                // Left labels (right-aligned, centered with bar)
                const labelX = MARGIN_LEFT - 20;
                const labelY = y + ROW_HEIGHT / 2;

                const label = document.createElementNS('http://www.w3.org/2000/svg', 'text');
                label.setAttribute('x', labelX);
                label.setAttribute('y', labelY - 6);
                label.setAttribute('text-anchor', 'end');
                label.setAttribute('font-size', '15');
                label.setAttribute('font-weight', '600');
                label.setAttribute('fill', '#1F2D3D');
                label.textContent = tier.label;
                svg.appendChild(label);

                if (tier.sublabel) {
                    const sub = document.createElementNS('http://www.w3.org/2000/svg', 'text');
                    sub.setAttribute('x', labelX);
                    sub.setAttribute('y', labelY + 8);
                    sub.setAttribute('text-anchor', 'end');
                    sub.setAttribute('font-size', '13');
                    sub.setAttribute('fill', '#6B7780');
                    sub.textContent = tier.sublabel;
                    svg.appendChild(sub);
                }

                // Right annotations (12px right of bar end, centered)
                const annotX = boxRightEdge + 12;
                const annotY = y + ROW_HEIGHT / 2;

                const perText = document.createElementNS('http://www.w3.org/2000/svg', 'text');
                perText.setAttribute('x', annotX);
                perText.setAttribute('y', annotY - 6);
                perText.setAttribute('font-size', '16');
                perText.setAttribute('font-weight', '700');
                perText.setAttribute('fill', '#1F2D3D');
                perText.textContent = `${data.per_100} per 100`;
                svg.appendChild(perText);

                const homesText = document.createElementNS('http://www.w3.org/2000/svg', 'text');
                homesText.setAttribute('x', annotX);
                homesText.setAttribute('y', annotY + 10);
                homesText.setAttribute('font-size', '13');
                homesText.setAttribute('fill', '#6B7780');
                homesText.textContent = `${formatNumber(data.supply)} homes / ${formatNumber(data.demand)} households`;
                svg.appendChild(homesText);

                // Surplus annotation
                if (data.surplus > 0) {
                    const surplusText = document.createElementNS('http://www.w3.org/2000/svg', 'text');
                    surplusText.setAttribute('x', annotX);
                    surplusText.setAttribute('y', annotY + 24);
                    surplusText.setAttribute('font-size', '13');
                    surplusText.setAttribute('fill', '#2F7F86');
                    surplusText.textContent = `Surplus: ${formatNumber(data.surplus)} homes`;
                    svg.appendChild(surplusText);
                }

                // Hover area
                const hover = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
                hover.setAttribute('x', boxX - 10);
                hover.setAttribute('y', y - 5);
                hover.setAttribute('width', chartWidth + 100);
                hover.setAttribute('height', ROW_HEIGHT + 10);
                hover.setAttribute('fill', 'transparent');
                hover.style.cursor = 'pointer';

                hover.addEventListener('mouseenter', (e) => {
                    let tooltipText = '';
                    if (tier.key === 'eli') {
                        tooltipText = `Homes available to ELI renters (≤30% AMI): ${formatNumber(data.supply)} / ${formatNumber(data.demand)} households (${data.per_100} per 100)`;
                    } else if (tier.key === 'fifty') {
                        tooltipText = `Additional homes available up to 50% AMI: ${formatNumber(data.supply - chartData.eli.supply)} / ${formatNumber(data.demand - chartData.eli.demand)} households (${data.per_100} per 100)`;
                    } else if (tier.key === 'eighty') {
                        tooltipText = `Additional homes available up to 80% AMI: ${formatNumber(data.supply - chartData.fifty.supply)} / ${formatNumber(data.demand - chartData.fifty.demand)} households (${data.per_100} per 100)`;
                    }
                    tooltip.style.opacity = '1';
                    tooltip.innerHTML = tooltipText;
                    tooltip.style.left = (e.pageX + 10) + 'px';
                    tooltip.style.top = (e.pageY + 10) + 'px';
                });

                hover.addEventListener('mouseleave', () => {
                    tooltip.style.opacity = '0';
                });

                svg.appendChild(hover);
            });
        }

        render();
        window.addEventListener('resize', render);
    </script>
</body>
</html>
